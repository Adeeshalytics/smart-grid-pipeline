<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 606" width="100%" font-size="11.5">
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8661a"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7b"/></marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; }
    .col { fill: #f4f7fa; stroke: #cfd8e1; }
    .hd { font-weight: 700; fill: #0f3557; font-size: 12.5px; text-anchor: middle; }
    .b { fill: #ffffff; stroke: #5b6b7b; stroke-width: 1; rx: 5; }
    .sp { fill: #e6f1fb; stroke: #1f6fb2; stroke-width: 1.3; }
    .bt { fill: #fdf0e3; stroke: #c8661a; stroke-width: 1.3; }
    .st { fill: #eef6ec; stroke: #3d8b40; stroke-width: 1.3; }
    .ob { fill: #f3effa; stroke: #6a4fb3; stroke-width: 1.3; }
    .t { font-weight: 700; fill: #1b2430; }
    .s { fill: #3c4a59; font-size: 10.3px; }
    .lb { stroke: #1f6fb2; stroke-width: 1.6; fill: none; marker-end: url(#ab); }
    .lo { stroke: #c8661a; stroke-width: 1.6; fill: none; marker-end: url(#ao); }
    .lg { stroke: #5b6b7b; stroke-width: 1.2; fill: none; marker-end: url(#ag); stroke-dasharray: 4 3; }
  </style>

  <!-- column backgrounds -->
  <rect class="col" x="4" y="4" width="150" height="496" rx="6"/>
  <rect class="col" x="162" y="4" width="170" height="496" rx="6"/>
  <rect class="col" x="340" y="4" width="262" height="496" rx="6"/>
  <rect class="col" x="610" y="4" width="212" height="496" rx="6"/>
  <rect class="col" x="830" y="4" width="166" height="496" rx="6"/>
  <text class="hd" x="79" y="23">SOURCES</text>
  <text class="hd" x="247" y="23">INGESTION</text>
  <text class="hd" x="471" y="23">PROCESSING</text>
  <text class="hd" x="716" y="23">STORAGE</text>
  <text class="hd" x="913" y="23">SERVING</text>

  <!-- sources -->
  <rect class="b sp" x="12" y="70" width="134" height="92" rx="5"/>
  <text class="t" x="20" y="88">Meter simulator</text>
  <text class="s" x="20" y="104">Python, 120 meters</text>
  <text class="s" x="20" y="118">1 reading / 15 sim-min</text>
  <text class="s" x="20" y="132">injects corrupt, late</text>
  <text class="s" x="20" y="146">and duplicate events</text>

  <rect class="b bt" x="12" y="360" width="134" height="92" rx="5"/>
  <text class="t" x="20" y="378">Tariff dropper</text>
  <text class="s" x="20" y="394">Python, 1 CSV per</text>
  <text class="s" x="20" y="408">simulated day</text>
  <text class="s" x="20" y="422">+ manifest (rows,</text>
  <text class="s" x="20" y="436">SHA-256)</text>

  <!-- ingestion -->
  <rect class="b sp" x="170" y="60" width="154" height="112" rx="5"/>
  <text class="t" x="178" y="78">Apache Kafka</text>
  <text class="s" x="178" y="94">meter.readings</text>
  <text class="s" x="178" y="108">6 partitions,</text>
  <text class="s" x="178" y="122">key = meter_id</text>
  <text class="s" x="178" y="140">meter.readings.dlq</text>
  <text class="s" x="178" y="154">grid.alerts</text>

  <rect class="b bt" x="170" y="370" width="154" height="72" rx="5"/>
  <text class="t" x="178" y="388">Landing zone</text>
  <text class="s" x="178" y="404">object store (S3 API)</text>
  <text class="s" x="178" y="418">tariffs/dt=YYYY-MM-DD/</text>
  <text class="s" x="178" y="432">tariffs.csv, _manifest</text>

  <!-- speed layer -->
  <rect class="b sp" x="348" y="40" width="246" height="176" rx="5"/>
  <text class="t" x="356" y="58">SPEED LAYER</text>
  <text class="s" x="356" y="73">Spark Structured Streaming, 4 queries</text>
  <text class="s" x="356" y="92">1  validate contract &#8594; rejects to DLQ</text>
  <text class="s" x="356" y="108">2  archive valid raw events (append)</text>
  <text class="s" x="356" y="124">3  watermark 30 min + dedup by event_id,</text>
  <text class="s" x="366" y="138">15-min windows by zone, alert rule</text>
  <text class="s" x="356" y="154">4  household running totals joined with</text>
  <text class="s" x="366" y="168">latest tariff &#8594; provisional bill</text>
  <text class="s" x="356" y="188">checkpoint per query, idempotent sinks</text>
  <text class="s" x="356" y="204">trigger 5 to 10 s</text>

  <!-- shared transforms -->
  <rect class="b" x="378" y="232" width="186" height="46" rx="5" style="fill:#fffbe6;stroke:#a88a00"/>
  <text class="t" x="471" y="250" text-anchor="middle">transforms.py</text>
  <text class="s" x="471" y="266" text-anchor="middle">one set of logic, used by both layers</text>

  <!-- batch layer -->
  <rect class="b bt" x="348" y="294" width="246" height="196" rx="5"/>
  <text class="t" x="356" y="312">BATCH LAYER</text>
  <text class="s" x="356" y="327">Airflow DAG, one run per simulated day</text>
  <text class="s" x="356" y="346">1  wait for tariff file (sensor)</text>
  <text class="s" x="356" y="362">2  verify checksum, validate, load tariffs</text>
  <text class="s" x="356" y="378">3  wait for late readings (grace period)</text>
  <text class="s" x="356" y="394">4  Spark batch: exact dedup, household</text>
  <text class="s" x="366" y="408">totals, join tariffs, billing rules</text>
  <text class="s" x="356" y="424">5  reconcile speed vs batch</text>
  <text class="s" x="356" y="440">6  quality gate</text>
  <text class="s" x="356" y="456">7  publish HTML + CSV report</text>
  <text class="s" x="356" y="476">idempotent; re-run any day by parameter</text>

  <!-- storage -->
  <rect class="b st" x="618" y="40" width="196" height="120" rx="5"/>
  <text class="t" x="626" y="58">PostgreSQL: real-time views</text>
  <text class="s" x="626" y="76">rt_zone_load</text>
  <text class="s" x="626" y="92">rt_household_today</text>
  <text class="s" x="626" y="108">grid_alerts</text>
  <text class="s" x="626" y="130">upsert on natural key</text>
  <text class="s" x="626" y="146">(current day, provisional)</text>

  <rect class="b st" x="618" y="176" width="196" height="102" rx="5"/>
  <text class="t" x="626" y="194">Data lake (Parquet, S3 API)</text>
  <text class="s" x="626" y="212">raw/meter_readings/</text>
  <text class="s" x="636" y="226">event_date=...  master dataset</text>
  <text class="s" x="626" y="244">curated/daily_household_bill/</text>
  <text class="s" x="626" y="262">reports/daily/  HTML, CSV</text>

  <rect class="b st" x="618" y="294" width="196" height="196" rx="5"/>
  <text class="t" x="626" y="312">PostgreSQL: batch views</text>
  <text class="s" x="626" y="330">daily_household_bill</text>
  <text class="s" x="626" y="346">daily_zone_summary</text>
  <text class="s" x="626" y="362">reconciliation</text>
  <text class="s" x="626" y="378">daily_reports</text>
  <text class="s" x="626" y="400">tariffs, tariff_rejects</text>
  <text class="s" x="626" y="416">pipeline_runs (audit trail)</text>
  <text class="s" x="626" y="438">atomic swap per day</text>
  <text class="s" x="626" y="454">(closed days, exact)</text>

  <!-- serving -->
  <rect class="b" x="850" y="100" width="140" height="150" rx="5"/>
  <text class="t" x="858" y="118">FastAPI</text>
  <text class="s" x="858" y="136">/grid/realtime</text>
  <text class="s" x="858" y="152">/billing/{day}</text>
  <text class="s" x="858" y="168">/households/{id}/</text>
  <text class="s" x="868" y="182">bill-to-date</text>
  <text class="s" x="858" y="200">merges real-time</text>
  <text class="s" x="858" y="214">and batch views</text>
  <text class="s" x="858" y="234">/health  /metrics</text>

  <rect class="b" x="850" y="300" width="140" height="116" rx="5"/>
  <text class="t" x="858" y="318">Grafana</text>
  <text class="s" x="858" y="336">Grid Operations</text>
  <text class="s" x="858" y="352">(business view)</text>
  <text class="s" x="858" y="372">Pipeline Health</text>
  <text class="s" x="858" y="388">(observability)</text>
  <text class="s" x="858" y="406">PostgreSQL + Prometheus</text>

  <!-- arrows: speed path -->
  <path class="lb" d="M146,116 L170,116"/>
  <path class="lb" d="M324,116 L348,116"/>
  <path class="lb" d="M594,96 L618,96"/>
  <path class="lb" d="M594,190 L606,190 L606,200 L618,200"/>
  <path class="lb" d="M348,200 L336,200 L336,152 L324,152"/>
  <path class="lb" d="M814,120 L850,120"/>
  <!-- arrows: batch path -->
  <path class="lo" d="M146,406 L170,406"/>
  <path class="lo" d="M324,406 L348,406"/>
  <path class="lo" d="M618,232 L606,232 L606,330 L594,330"/>
  <path class="lo" d="M594,410 L618,410"/>
  <path class="lo" d="M594,350 L612,350 L612,256 L618,256"/>
  <path class="lo" d="M814,310 L830,310 L830,220 L850,220"/>
  <!-- tariffs feeding speed layer -->
  <path class="lg" d="M760,294 L760,290 L584,290 L584,216"/>
  <text class="s" x="640" y="287" style="font-size:9.3px">latest tariff</text>
  <!-- grafana reads -->
  <path class="lg" d="M814,360 L850,360"/>

  <!-- observability -->
  <rect class="b ob" x="4" y="512" width="992" height="88" rx="6"/>
  <text class="t" x="14" y="532" style="fill:#3e2a8a">OBSERVABILITY (every stage)</text>
  <text class="s" x="14" y="552">Structured JSON logs: same envelope in simulators, Spark, Airflow tasks and API (ts, level, service, stage, event + context)</text>
  <text class="s" x="14" y="569">Metrics: Prometheus scrapes meter-simulator, tariff-dropper, speed-layer and API (incl. data freshness and reconciliation gauges)</text>
  <text class="s" x="14" y="586">Alerts: 15 rules by stage &#8594; Alertmanager &#8594; API &#8594; ops_alerts.   Lineage: event_id, Kafka offset, batch_id, run_id on every bill, pipeline_runs</text>
</svg>
