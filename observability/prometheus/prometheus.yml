global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # One job per pipeline stage, so `up{job=...}` says which stage is down.
  - job_name: meter-simulator        # ingestion: streaming source
    static_configs: [{targets: ["meter-simulator:9101"]}]
  - job_name: tariff-dropper         # ingestion: daily batch source
    static_configs: [{targets: ["tariff-dropper:9102"]}]
  - job_name: speed-layer            # processing: Spark Structured Streaming
    static_configs: [{targets: ["speed-layer:9103"]}]
  - job_name: api                    # serving + data-freshness gauges read from the serving store
    static_configs: [{targets: ["api:8000"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
