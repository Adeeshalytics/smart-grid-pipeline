# Smart Grid Energy Monitoring & Billing - Lambda architecture, end to end.
#
#   docker compose up -d --build
#
# Sources      meter-simulator (stream), tariff-dropper (daily batch file)
# Ingestion    kafka, objectstore (landing zone)
# Speed layer  speed-layer (Spark Structured Streaming)
# Batch layer  airflow (orchestration + Spark batch job)
# Storage      objectstore (raw + curated Parquet), postgres (serving store)
# Serving      api (FastAPI), grafana
# Observability prometheus, alertmanager, grafana

name: smart-grid-pipeline

x-python-image: &python-image
  build: {context: ., dockerfile: docker/python.Dockerfile}
  image: grid-python

x-grid-env: &grid-env
  KAFKA_BOOTSTRAP: kafka:9092
  POSTGRES_HOST: postgres
  POSTGRES_DB: grid
  POSTGRES_USER: ${POSTGRES_USER:-grid}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grid}
  S3_ENDPOINT: http://objectstore:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gridadmin}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-gridadmin123}
  SIM_DAY_SECONDS: ${SIM_DAY_SECONDS:-300}
  NUM_HOUSEHOLDS: ${NUM_HOUSEHOLDS:-120}
  RANDOM_SEED: ${RANDOM_SEED:-8203}
  LOW_RENEWABLE_THRESHOLD: ${LOW_RENEWABLE_THRESHOLD:-0.20}
  WATERMARK: ${WATERMARK:-30 minutes}

services:
  # ------------------------------------------------------------ infrastructure
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly by `init`
      KAFKA_HEAP_OPTS: -Xmx512m -Xms256m
    ports: ["29092:29092"]
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grid
      POSTGRES_USER: ${POSTGRES_USER:-grid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grid}
    ports: ["5433:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grid} -d grid"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # S3-compatible object store: landing zone, data lake (Parquet) and reports.
  objectstore:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -s3.port=8333 -volume.max=50 -master.volumeSizeLimitMB=256
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-gridadmin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-gridadmin123}
    ports: ["8333:8333", "8888:8888"]   # S3 API, file browser
    volumes: [objectstore-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8333/"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # One-shot job: create Kafka topics and object-store buckets, then exit.
  init:
    <<: *python-image
    command: ["sh", "-c", "python -m ingestion.topics && python -m ingestion.buckets"]
    environment: *grid-env
    depends_on:
      kafka: {condition: service_healthy}
      objectstore: {condition: service_healthy}

  # -------------------------------------------------------------- data sources
  meter-simulator:
    <<: *python-image
    command: ["python", "-m", "simulators.stream_meter_simulator"]
    environment: *grid-env
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  tariff-dropper:
    <<: *python-image
    command: ["python", "-m", "simulators.batch_tariff_dropper"]
    environment: *grid-env
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    restart: unless-stopped

  # --------------------------------------------------------------- speed layer
  speed-layer:
    build: {context: ., dockerfile: docker/spark.Dockerfile}
    image: grid-spark
    command:
      - spark-submit
      - --master
      - local[3]
      - --driver-memory
      - 1g
      - --conf
      - spark.ui.enabled=false
      - /opt/grid/src/processing/speed_layer.py
    environment:
      <<: *grid-env
      CHECKPOINT_DIR: /checkpoints
    volumes: [spark-checkpoints:/checkpoints]
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    mem_limit: 2g
    restart: unless-stopped   # a failed query exits the driver; it resumes from the checkpoints

  # --------------------------------------------------------------- batch layer
  airflow:
    build: {context: ., dockerfile: docker/airflow.Dockerfile}
    image: grid-airflow
    command:
      - bash
      - -c
      - |
        airflow db migrate &&
        (airflow users create --username admin --password admin --firstname Grid \
           --lastname Admin --role Admin --email admin@example.com || true) &&
        (airflow scheduler &) &&
        exec airflow webserver
    environment:
      <<: *grid-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-grid}:${POSTGRES_PASSWORD:-grid}@postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__WEBSERVER__WORKERS: "1"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      REPORT_DIR: /opt/airflow/reports
    ports: ["8080:8080"]
    volumes: ["./reports:/opt/airflow/reports"]
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 20
    mem_limit: 2500m
    restart: unless-stopped

  # ------------------------------------------------------------------- serving
  api:
    <<: *python-image
    command: ["uvicorn", "serving.api:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment: *grid-env
    ports: ["8000:8000"]
    depends_on:
      init: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/metrics', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------- observability
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    ports: ["9090:9090"]
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports: ["9093:9093"]
    volumes: ["./observability/alertmanager:/etc/alertmanager:ro"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # read-only access without login, for the demo
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/grid_operations.json
      GRID_DB_USER: ${POSTGRES_USER:-grid}
      GRID_DB_PASSWORD: ${POSTGRES_PASSWORD:-grid}
    ports: ["3000:3000"]
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  kafka-data:
  pg-data:
  objectstore-data:
  spark-checkpoints:
  prometheus-data:
